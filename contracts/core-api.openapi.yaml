    Conflict:
      properties:
        type:
          $ref: '#/components/schemas/ConflictType'
        severity:
          $ref: '#/components/schemas/Severity'
        constraint:
          anyOf:
          - $ref: '#/components/schemas/ConflictConstraint'
          - type: 'null'
          description: The independent scheduling constraint that was violated.
        event_ids:
          items:
            type: string
            format: uuid
