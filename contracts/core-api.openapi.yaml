          type: string
          title: Message
        override_required:
          type: boolean
          title: Override Required
      type: object
      required:
      - type
      - severity
      - event_ids
      - start_at
      - end_at
      - message
      - override_required
      title: Conflict
      description: One violated constraint. Type and severity are assigned only by the Core engine.
